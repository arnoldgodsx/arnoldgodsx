<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;900&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#fff; font-family:'Inter Tight',sans-serif; -webkit-font-smoothing:antialiased; }
  html.dark { filter:invert(1); }
  section { width:1280px; height:580px; position:relative; overflow:hidden; background:#fff; }
  .char { position:absolute; right:150px; top:30px; height:760px; filter:grayscale(1) brightness(1.09) contrast(1.38); mix-blend-mode:multiply; }
  .word { position:absolute; left:0; right:0; bottom:70px; text-align:center; font-weight:900; font-size:232px; line-height:1;
    letter-spacing:-.03em; color:#fff; mix-blend-mode:difference; -webkit-text-stroke:1.2px #fff; }
  .word i { font-family:'Instrument Serif',serif; font-weight:400; letter-spacing:-.02em; -webkit-text-stroke:0; }
</style>
</head>
<body>
<section id="hero">
  <img class="char" src="IMG_HERO">
  <div class="word">Arnold<i>Gods</i></div>
</section>
</body>
</html>
